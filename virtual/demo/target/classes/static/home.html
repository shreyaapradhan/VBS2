<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Banking System - Home</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(139, 21, 56, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        top: -250px;
        right: -250px;
        animation: float 20s ease-in-out infinite;
    }

    body::after {
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(44, 90, 160, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        bottom: -200px;
        left: -200px;
        animation: float 15s ease-in-out infinite reverse;
    }

    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, 30px) scale(1.1); }
    }

    .container {
        width: 90%;
        max-width: 450px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(139, 21, 56, 0.1);
        overflow: hidden;
        position: relative;
        z-index: 1;
    }

    .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #8B1538 0%, #2c5aa0 50%, #c0392b 100%);
        z-index: 2;
    }

    .header {
        background: linear-gradient(135deg, #8B1538 0%, #2c5aa0 100%);
        padding: 40px 30px;
        text-align: center;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        animation: pulse 8s ease-in-out infinite;
    }

    .header::after {
        content: '🏦';
        position: absolute;
        font-size: 120px;
        opacity: 0.08;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.05; }
        50% { transform: scale(1.2); opacity: 0.08; }
    }

    .header h1 {
        font-size: 32px;
        margin-bottom: 8px;
        font-weight: 300;
        letter-spacing: 4px;
        position: relative;
        z-index: 1;
    }

    .header h1::before {
        content: '💳';
        margin-right: 12px;
        font-size: 28px;
    }

    .header p {
        font-size: 13px;
        opacity: 0.95;
        font-weight: 300;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
    }

    .content {
        padding: 40px 30px;
    }

    .home-content {
        text-align: center;
    }

    .home-content h2 {
        color: #2c3e50;
        margin-bottom: 20px;
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 1px;
    }

    .home-content p {
        color: #7f8c8d;
        line-height: 1.8;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .btn-group {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }

    .btn {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .btn-primary {
        background: linear-gradient(135deg, #8B1538 0%, #2c5aa0 100%);
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(139, 21, 56, 0.3);
    }

    .btn-secondary {
        background: #fafbfc;
        color: #2c3e50;
        border: 1px solid #dce1e8;
    }

    .btn-secondary:hover {
        background: #f0f1f3;
    }

    .btn:active {
        transform: translateY(0);
    }

    .features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 30px 0;
    }

    .feature {
        padding: 20px;
        background: #fafbfc;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #dce1e8;
    }

    .feature-icon {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .feature h3 {
        font-size: 14px;
        color: #2c3e50;
        margin-bottom: 5px;
        font-weight: 400;
    }

    .feature p {
        font-size: 12px;
        color: #7f8c8d;
    }

    .floating-icon {
        position: absolute;
        font-size: 30px;
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
        animation: floatAround 15s infinite ease-in-out;
    }

    @keyframes floatAround {
        0%, 100% {
            transform: translate(0, 0) rotate(0deg);
            opacity: 0.1;
        }
        25% {
            transform: translate(50px, -50px) rotate(90deg);
            opacity: 0.2;
        }
        50% {
            transform: translate(100px, 0) rotate(180deg);
            opacity: 0.15;
        }
        75% {
            transform: translate(50px, 50px) rotate(270deg);
            opacity: 0.2;
        }
    }

    .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: linear-gradient(135deg, #8B1538, #2c5aa0);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
    }

    @keyframes particleFloat {
        0% {
            transform: translateY(0) translateX(0);
            opacity: 0;
        }
        10% {
            opacity: 0.8;
        }
        90% {
            opacity: 0.3;
        }
        100% {
            transform: translateY(-100vh) translateX(var(--drift));
            opacity: 0;
        }
    }
  </style>
</head>
<body>
<div id="floatingIcons"></div>
<div id="particles"></div>
<div class="container">
  <div class="header">
    <h1>VBS</h1>
    <p>Virtual Banking System</p>
  </div>

  <div class="content">
    <div class="home-content">
      <h2>Welcome to VBS</h2>
      <p>Experience secure and convenient banking at your fingertips. Manage your finances with confidence.</p>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="window.location.href='login.html'">Login</button>
        <button class="btn btn-secondary" onclick="window.location.href='signup.html'">Sign Up</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Create floating banking icons
  const createFloatingIcons = () => {
      const icons = ['💰', '💳', '💵', '🏦', '💎', '📊', '💼', '🔒'];
      const container = document.getElementById('floatingIcons');

      icons.forEach((icon, index) => {
          const iconEl = document.createElement('div');
          iconEl.className = 'floating-icon';
          iconEl.textContent = icon;
          iconEl.style.left = Math.random() * 100 + '%';
          iconEl.style.top = Math.random() * 100 + '%';
          iconEl.style.animationDelay = (index * 2) + 's';
          iconEl.style.animationDuration = (15 + Math.random() * 10) + 's';
          container.appendChild(iconEl);
      });
  };

  // Create floating particles
  const createParticles = () => {
      const container = document.getElementById('particles');

      setInterval(() => {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = Math.random() * 100 + '%';
          particle.style.bottom = '-10px';
          particle.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
          particle.style.animation = `particleFloat ${8 + Math.random() * 4}s linear`;

          container.appendChild(particle);

          setTimeout(() => {
              particle.remove();
          }, 12000);
      }, 800);
  };

  // Mouse trail effect
  let mouseTrail = [];
  document.addEventListener('mousemove', (e) => {
      if (mouseTrail.length > 20) {
          const old = mouseTrail.shift();
          if (old && old.parentNode) old.remove();
      }

      const trail = document.createElement('div');
      trail.style.position = 'absolute';
      trail.style.width = '8px';
      trail.style.height = '8px';
      trail.style.borderRadius = '50%';
      trail.style.background = 'radial-gradient(circle, rgba(139, 21, 56, 0.4), rgba(44, 90, 160, 0.2))';
      trail.style.left = e.pageX + 'px';
      trail.style.top = e.pageY + 'px';
      trail.style.pointerEvents = 'none';
      trail.style.zIndex = '0';
      trail.style.transform = 'translate(-50%, -50%)';
      trail.style.transition = 'all 0.5s ease-out';

      document.body.appendChild(trail);
      mouseTrail.push(trail);

      setTimeout(() => {
          trail.style.opacity = '0';
          trail.style.transform = 'translate(-50%, -50%) scale(0)';
      }, 10);
  });

  // Initialize animations
  createFloatingIcons();
  createParticles();
</script>
</body>
</html>
